<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章 · Terrorschiki</title>
<meta name="description" content="个人博客长文阅读页：前端实时渲染 Markdown 与 KaTeX 公式。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  :root {
    --bg: #f6f8fa;
    --bg-soft: #eef1f4;
    --card: #ffffff;
    --text: #1f2328;
    --text-soft: #57606a;
    --primary: #0969da;
    --border: #d0d7de;
    --code-bg: #f0f3f6;
    --table-stripe: #f6f8fa;
    --shadow: 0 1px 3px rgba(0, 0, 0, .08);
  }
  html[data-theme="dark"] {
    --bg: #0b0e14;
    --bg-soft: #10141c;
    --card: #0f141d;
    --text: #d5dbe3;
    --text-soft: #8b949e;
    --primary: #58a6ff;
    --border: #262d3a;
    --code-bg: #131924;
    --table-stripe: #10141c;
    --shadow: 0 1px 3px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.75;
  }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px;
    background: color-mix(in srgb, var(--card) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar .icon-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    line-height: 1.2;
  }
  .topbar .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
  .topbar .brand {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar .brand .tag {
    font-size: 12px; font-weight: 400; color: var(--text-soft);
    margin-left: 8px;
  }
  .topbar-right { margin-left: auto; display: flex; gap: 8px; }

  .layout {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    gap: 32px;
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  aside.toc {
    position: sticky;
    top: 72px;
    align-self: start;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
    font-size: 13.5px;
    border-left: 2px solid var(--border);
    padding-left: 14px;
  }
  aside.toc .toc-title {
    font-weight: 600; color: var(--text-soft);
    letter-spacing: .08em; margin-bottom: 8px; font-size: 12px;
  }
  aside.toc a {
    display: block;
    color: var(--text-soft);
    text-decoration: none;
    padding: 3px 0;
    border-radius: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  aside.toc a.lv3 { padding-left: 14px; font-size: 12.5px; }
  aside.toc a:hover { color: var(--primary); }
  aside.toc a.active { color: var(--primary); font-weight: 600; }

  main article {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 36px 44px;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; gap: 16px; padding-top: 16px; }
    aside.toc { display: none; position: static; max-height: none; border-left: none; padding-left: 0; }
    main article { padding: 24px 20px; }
  }

  .markdown-body { font-size: 15.5px; }
  .markdown-body > :first-child { margin-top: 0; }
  .markdown-body h1 {
    font-size: 26px; line-height: 1.4;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .markdown-body h2 {
    font-size: 21px; margin-top: 40px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .markdown-body h3 { font-size: 17.5px; margin-top: 28px; }
  .markdown-body h4 { font-size: 15.5px; margin-top: 22px; color: var(--text-soft); }
  .markdown-body p { margin: 12px 0; }
  .markdown-body a { color: var(--primary); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body ul, .markdown-body ol { padding-left: 26px; }
  .markdown-body li { margin: 4px 0; }
  .markdown-body blockquote {
    margin: 14px 0; padding: 8px 16px;
    border-left: 4px solid var(--primary);
    background: var(--bg-soft);
    border-radius: 0 8px 8px 0;
    color: var(--text-soft);
  }
  .markdown-body blockquote p { margin: 6px 0; }
  .markdown-body code {
    font-family: "Cascadia Code", Consolas, "JetBrains Mono", monospace;
    font-size: 13.5px;
    background: var(--code-bg);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .markdown-body pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    line-height: 1.6;
  }
  .markdown-body pre code { background: none; padding: 0; font-size: 13px; }
  .markdown-body table {
    border-collapse: collapse;
    margin: 14px 0;
    width: 100%;
    font-size: 14px;
    display: block;
    overflow-x: auto;
  }
  .markdown-body th, .markdown-body td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .markdown-body th { background: var(--bg-soft); font-weight: 600; }
  .markdown-body tr:nth-child(even) td { background: var(--table-stripe); }
  .markdown-body img {
    max-width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin: 6px 0;
  }
  .markdown-body hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
  .markdown-body .katex-display { overflow-x: auto; padding: 6px 0; }

  .page-footer {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 60px;
    color: var(--text-soft);
    font-size: 13px;
  }
  .page-footer a { color: var(--primary); text-decoration: none; }
  .page-footer a:hover { text-decoration: underline; }

  .notice { color: var(--text-soft); }
  .notice.error { color: #cf222e; }
  html[data-theme="dark"] .notice.error { color: #ff7b72; }

  .to-top {
    position: fixed; right: 22px; bottom: 26px;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .to-top.show { opacity: 1; pointer-events: auto; }
  .to-top:hover { color: var(--primary); border-color: var(--primary); }
</style>
</head>
<body>

<header class="topbar">
  <a class="icon-btn" href="../" title="返回首页">← 首页</a>
  <span class="brand">📄 文章<span class="tag">Terrorschiki 个人博客</span></span>
  <div class="topbar-right">
    <a class="icon-btn" id="md-download" href="#" title="下载 Markdown 原文" download>⤓</a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换主题">☀️</button>
  </div>
</header>

<div class="layout">
  <aside class="toc" id="toc" aria-label="目录">
    <div class="toc-title">目录</div>
    <nav id="toc-nav"></nav>
  </aside>

  <main>
    <article class="markdown-body" id="content">
      <p class="notice">正在加载文章 …</p>
    </article>
  </main>
</div>

<footer class="page-footer">
  <p>本页由 <code>articles/*.md</code> 在前端实时渲染（marked + KaTeX），无需任何构建步骤。
  · <a href="../">返回首页</a></p>
</footer>

<button id="to-top" class="to-top" type="button" aria-label="回到顶部">↑</button>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
(function () {
  'use strict';

  var contentEl = document.getElementById('content');
  var tocNav = document.getElementById('toc-nav');
  var tocBox = document.getElementById('toc');
  var themeToggle = document.getElementById('theme-toggle');
  var toTop = document.getElementById('to-top');
  var mdDownload = document.getElementById('md-download');

  /* ---------------- 主题：跟随主站 localStorage，默认跟随系统 ---------------- */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) { /* 忽略 */ }
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved || (prefersDark ? 'dark' : 'light'));
    themeToggle.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('theme', next); } catch (e) { /* 忽略 */ }
    });
  })();

  /* ---------------- 锚点（与 slam-wiki-site 同一套 slug 算法） ---------------- */
  var SLUG_STRIP = /[\u2000-\u206F\u2E00-\u2E7F\u3000-\u303F\uFF00-\uFFEF!-\/:-@\[-\^`{-~]/g;
  function slugify(text) {
    return String(text).trim().toLowerCase().replace(SLUG_STRIP, '').replace(/\s+/g, '-');
  }
  function assignHeadingIds() {
    var used = Object.create(null);
    var headings = contentEl.querySelectorAll('h1, h2, h3, h4');
    Array.prototype.forEach.call(headings, function (h) {
      var base = slugify(h.textContent) || 'section';
      var id = base, n = 1;
      while (used[id]) { id = base + '-' + n++; }
      used[id] = true;
      h.id = id;
    });
  }

  /* ---------------- 目录 ---------------- */
  function buildToc() {
    var headings = contentEl.querySelectorAll('h2, h3');
    if (!headings.length) { tocBox.style.display = 'none'; return; }
    var frag = document.createDocumentFragment();
    Array.prototype.forEach.call(headings, function (h) {
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = h.tagName === 'H3' ? 'lv3' : 'lv2';
      frag.appendChild(a);
    });
    tocNav.innerHTML = '';
    tocNav.appendChild(frag);

    if (!('IntersectionObserver' in window)) return;
    var links = tocNav.querySelectorAll('a');
    var map = Object.create(null);
    Array.prototype.forEach.call(links, function (a) { map[a.hash.slice(1)] = a; });
    var current = null;
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var link = map[entry.target.id];
        if (!link || link === current) return;
        if (current) current.classList.remove('active');
        link.classList.add('active');
        current = link;
      });
    }, { rootMargin: '-64px 0px -70% 0px', threshold: 0 });
    Array.prototype.forEach.call(headings, function (h) { observer.observe(h); });
  }

  /* ---------------- 正文增强 ---------------- */
  function decorate() {
    var links = contentEl.querySelectorAll('a[href]');
    Array.prototype.forEach.call(links, function (a) {
      var href = a.getAttribute('href') || '';
      if (/^https?:\/\//i.test(href)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    });
    var boxes = contentEl.querySelectorAll('input[type="checkbox"]');
    Array.prototype.forEach.call(boxes, function (box) {
      box.disabled = true;
      box.setAttribute('aria-label', '检查项');
    });
  }

  /* ---------------- KaTeX ---------------- */
  function typesetMath() {
    if (typeof window.renderMathInElement !== 'function') return;
    try {
      window.renderMathInElement(contentEl, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false }
        ],
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option'],
        throwOnError: false
      });
    } catch (err) {
      console.warn('[math] KaTeX 渲染失败：', err);
    }
  }

  /* ---------------- 加载 ---------------- */
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c];
    });
  }
  function showLoadError(err) {
    contentEl.innerHTML =
      '<h1>无法加载文章</h1>' +
      '<div class="notice error"><p>请确认 Markdown 文件存在且通过 HTTP 服务器访问本页面。</p>' +
      '<pre>' + escapeHtml(String((err && err.message) || err)) + '</pre></div>';
    tocBox.style.display = 'none';
  }

  async function boot() {
    if (typeof window.marked === 'undefined') {
      showLoadError(new Error('marked 未加载成功（CDN 被拦截？）'));
      return;
    }
    // 只允许 articles/ 目录下的 .md 文件名，防止路径穿越
    var params = new URLSearchParams(location.search);
    var md = params.get('md') || '';
    if (!/^[a-z0-9][a-z0-9._-]*\.md$/.test(md)) {
      showLoadError(new Error('缺少或非法的 ?md= 参数，例如 article.html?md=dji-rc-award-2026-tech.md'));
      return;
    }
    try {
      var res = await fetch(md, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
      var text = await res.text();
      contentEl.innerHTML = window.marked.parse(text, { gfm: true, breaks: false });
      mdDownload.href = md;
      decorate();
      assignHeadingIds();
      buildToc();
      typesetMath();
      document.title = ((contentEl.querySelector('h1') || {}).textContent || '文章') + ' · Terrorschiki';
    } catch (err) {
      showLoadError(err);
    }
  }

  window.addEventListener('scroll', function () {
    toTop.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });
  toTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  boot();
})();
</script>
</body>
</html>
